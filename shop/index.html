<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La collection Atome." />
    <meta name="theme-color" content="#11110F" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css?v=20261004-8" />
    <link rel="stylesheet" href="./shop.css?v=20261004-6" />
    <title>ATOME - Collection</title>
  </head>
  <body>
    <div class="site-shell catalog-page">
      <header class="site-header">
        <a class="brand-logo" href="../" aria-label="Atome, retour à l'accueil">
          <img src="../atome-logo-black.png" alt="" width="108" height="45" />
        </a>

        <nav class="main-nav" aria-label="Navigation principale">
          <a href="../">Accueil</a>
          <a href="#collection">Collection</a>
        </nav>

        <a class="catalog-back" href="../">Retour <span aria-hidden="true">↖</span></a>
      </header>

      <main>
        <section class="catalog-intro reveal" aria-labelledby="catalog-title">
          <h1 id="catalog-title">NOTRE<br /><em>COLLECTION&nbsp;!</em></h1>
        </section>

        <section class="catalog-grid" id="collection" aria-label="Collection Atome">
          <article class="catalog-item reveal" id="hiver">
            <div class="catalog-visual product-visual" data-product-visual tabindex="0" role="button" aria-pressed="false" aria-label="Voir l'ensemble Atome Hiver porté">
              <img class="product-image product-flat" src="../vetement%20realiste%20sans%20humain.png" alt="L'ensemble Atome Hiver présenté à plat" />
              <img class="product-image product-worn" src="../vetement%20humain%20hiver.png" alt="L'ensemble Atome Hiver porté, vu de face et de dos" />
            </div>
            <div class="catalog-item-info">
              <div>
                <h2>Atome - Hiver</h2>
              </div>
              <span class="catalog-status">Découvrir</span>
            </div>
          </article>

          <article class="catalog-item reveal reveal-delay" id="bonnet">
            <div class="catalog-visual product-visual" data-product-visual tabindex="0" role="button" aria-pressed="false" aria-label="Voir le bonnet Atome porté">
              <img class="product-image product-flat" src="../bonnet%20r%C3%A9aliste.png" alt="Le bonnet Atome présenté à plat" />
              <img class="product-image product-worn" src="../Bonnet%20sur%20humain.png" alt="Le bonnet Atome porté" />
            </div>
            <div class="catalog-item-info">
              <div>
                <h2>Atome - Bonnet</h2>
              </div>
              <span class="catalog-status">Découvrir</span>
            </div>
          </article>

          <article class="catalog-item catalog-item--summer reveal" id="ete">
            <div class="catalog-visual product-visual" data-product-visual tabindex="0" role="button" aria-pressed="false" aria-label="Voir l'ensemble été Atome porté">
              <img class="product-image product-flat" src="../short%20et%20t-shirt%20sans%20humain.png" alt="L'ensemble été Atome avec short et t-shirt présenté à plat" />
              <img class="product-image product-worn" src="../short%20et%20t-shirt%20avec%20humain.png" alt="L'ensemble été Atome avec short et t-shirt porté" />
            </div>
            <div class="catalog-item-info">
              <div>
                <h2>Atome - Ensemble été short et t-shirt</h2>
              </div>
              <span class="catalog-status">Découvrir</span>
            </div>
          </article>
        </section>

        <section class="catalog-discord reveal" aria-labelledby="catalog-discord-title">
          <p class="eyebrow">Suivre notre projet</p>
          <a id="catalog-discord-title" href="https://discord.gg/dRkbkfJsdC" target="_blank" rel="noreferrer">Rejoignez le Discord <span aria-hidden="true">↗</span></a>
        </section>
      </main>

      <footer class="site-footer">
        <div class="footer-top">
          <a class="wordmark footer-wordmark" href="../">ATOME</a>
          <p>© <span id="year"></span> ATOME</p>
        </div>
        <div class="footer-links">
          <a href="https://discord.gg/dRkbkfJsdC" target="_blank" rel="noreferrer">Discord <span aria-hidden="true">↗</span></a>
          <a href="mailto:contact@atome-wear.com">Contact <span aria-hidden="true">↗</span></a>
          <a href="#">Mentions légales</a>
        </div>
      </footer>
    </div>
    <script src="../script.js?v=20261004-2"></script>
  </body>
</html>
